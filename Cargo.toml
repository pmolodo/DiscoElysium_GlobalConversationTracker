# A WORKSPACE, so that something small can be built from the formats alone. The mod reads
# its own state file from inside the game by linking a library, and a library built from
# this package would carry the whole search with it - see crates/gct-formats.
#
# The root package is a member of its own workspace, so `cargo build` and `cargo test` at
# the root still mean what they meant, and `target/release/gct-engine-host.exe` is still
# where it was.
[workspace]
members = ["crates/*"]

[package]
name = "lookahead_engine"
version = "0.1.0"
edition = "2024"

[lib]
# rlib, and only rlib: for the tests, the benches, the CLI and the engine host. There was
# a cdylib here for the plugin to DllImport, which is how the look-ahead first got back
# into C# (de-i5xj.1); the plugin now spawns the host binary instead (de-bnjy.1), so
# nothing loads this crate as a library any more and building a thirty-megabyte one on
# every build bought nothing.
crate-type = ["rlib"]

# THE ENGINE AS A PROCESS the game talks to over a pipe, rather than a library it loads -
# de-bnjy.1. Named explicitly, and NOT in src/bin/ where Cargo would find it by itself,
# because src/.gitignore ignores bin/ for the .NET projects that share this tree: a binary
# put there would be invisible to Git and would not survive a fresh clone.
[[bin]]
name = "gct-engine-host"
path = "src/host_main.rs"

[dependencies]
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
petgraph = { version = "0.6", features = ["serde-1", "graphmap"] }
oxidd = "0.12.0"
prost = "0.13"

# The file formats, which this re-exports as `formats` so every path that named them as a
# module still names them. Their own dependencies - the diff, the zip, the clock - travel
# with them rather than with the search.
#
# THE SAVE-FILE HALF, which re-exports the other half, so one name here reaches every format
# this repository defines. The engine is outside the game and wants all of them; the split is
# for the library the game links, which takes `gct_formats` alone. See de-2p8j.1.
gct_save_files = { path = "crates/gct-save-files" }

# The wire's types, generated from proto/engine.proto by build.rs.
#
# PROTOX RATHER THAN PROTOC, and the difference is whether the build has a prerequisite.
# prost-build shells out to a protoc binary it does not ship, so a checkout would build only
# on a machine where someone had installed one - and the failure lands on a contributor who
# changed nothing to do with the wire. protox is a compiler for the same language written in
# Rust, so it arrives with the dependencies and there is nothing to install.
[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
proptest = "1.0"

# The shared measurement and test modules, which used to be text every example and test
# included - see crates/gct-measure and de-07kd. A dev-dependency that depends back on this
# package, which Cargo allows and which is what keeps one `Shipped` for everyone.
gct_measure = { path = "crates/gct-measure" }

# For the tests that open a packed save and look inside it. The packer itself lives with the
# formats and brings its own copy; this is the reader a test uses to check what it wrote.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
