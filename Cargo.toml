[package]
name = "lookahead_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
petgraph = { version = "0.6", features = ["serde-1", "graphmap"] }
oxidd = "0.12.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "benchmarks"
harness = false
