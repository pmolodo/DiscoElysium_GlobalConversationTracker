[package]
name = "lookahead_engine"
version = "0.1.0"
edition = "2024"

[lib]
# rlib for the tests, benches and the CLI; cdylib for the plugin, which runs inside the
# game's Mono runtime and reaches this through DllImport. See de-i5xj.1 - the look-ahead
# is moving out of C# and this is how it gets back in.
crate-type = ["rlib", "cdylib"]

# THE ENGINE AS A PROCESS the game talks to over a pipe, rather than a library it loads -
# de-bnjy.1. Named explicitly, and NOT in src/bin/ where Cargo would find it by itself,
# because src/.gitignore ignores bin/ for the .NET projects that share this tree: a binary
# put there would be invisible to Git and would not survive a fresh clone.
[[bin]]
name = "gct-engine-host"
path = "src/host_main.rs"

[dependencies]
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
petgraph = { version = "0.6", features = ["serde-1", "graphmap"] }
oxidd = "0.12.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "benchmarks"
harness = false

# MEASUREMENTS LIVE HERE, not in tests/. A test passes or fails on its own; a measurement
# produces a number a person reads, and the two were being confused - see de-18bo, which
# carries moving the rest of them across. Run one with:
#
#     tools/run-logged.sh cargo answers -- cargo run --release --example symbolic_answers
[[example]]
name = "symbolic_answers"
path = "measurements/symbolic_answers.rs"
