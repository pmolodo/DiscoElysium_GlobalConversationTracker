[package]
name = "lookahead_engine"
version = "0.1.0"
edition = "2024"

[lib]
# rlib, and only rlib: for the tests, the benches, the CLI and the engine host. There was
# a cdylib here for the plugin to DllImport, which is how the look-ahead first got back
# into C# (de-i5xj.1); the plugin now spawns the host binary instead (de-bnjy.1), so
# nothing loads this crate as a library any more and building a thirty-megabyte one on
# every build bought nothing.
crate-type = ["rlib"]

# THE ENGINE AS A PROCESS the game talks to over a pipe, rather than a library it loads -
# de-bnjy.1. Named explicitly, and NOT in src/bin/ where Cargo would find it by itself,
# because src/.gitignore ignores bin/ for the .NET projects that share this tree: a binary
# put there would be invisible to Git and would not survive a fresh clone.
[[bin]]
name = "gct-engine-host"
path = "src/host_main.rs"

[dependencies]
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3"
petgraph = { version = "0.6", features = ["serde-1", "graphmap"] }
oxidd = "0.12.0"

[dev-dependencies]
proptest = "1.0"

# MEASUREMENTS LIVE HERE, not in tests/. A test passes or fails on its own; a measurement
# produces a number a person reads, and the two were being confused - see de-18bo. Run one
# with:
#
#     tools/run-logged.sh cargo answers -- cargo run --release --example symbolic_answers
#
# An example rather than a test because that is what these are: a `main` somebody runs, not
# a claim the suite can check. It also takes them out of `cargo test`, which used to compile
# and link every one of them on the way to running none.
#
# EACH NEEDS ITS PATH SPELLED OUT. Cargo looks for examples in examples/, and these live in
# measurements/ beside the logs they produce.
[[example]]
name = "symbolic_answers"
path = "measurements/symbolic_answers.rs"

[[example]]
name = "backward_support"
path = "measurements/backward_support.rs"

[[example]]
name = "cache_split"
path = "measurements/cache_split.rs"

[[example]]
name = "guard_depth"
path = "measurements/guard_depth.rs"

# A SNAPSHOT rather than a measurement: it dumps every parsed guard to a file named by
# GUARD_SNAPSHOT, to be diffed across a change to the parser.
[[example]]
name = "guard_snapshot"
path = "measurements/guard_snapshot.rs"

[[example]]
name = "guard_stack"
path = "measurements/guard_stack.rs"

# The half of tests/manager_memory.rs that has to FILL a manager to answer anything.
[[example]]
name = "manager_memory"
path = "measurements/manager_memory.rs"

# Two arms of one question behind one `main`, picked by argument, because the arm that
# fails takes the process with it - see the note there.
[[example]]
name = "menu_residue"
path = "measurements/menu_residue.rs"

# Two measurements behind one `main`, picked by argument - see the note on `main` there.
[[example]]
name = "layout_shape"
path = "measurements/layout_shape.rs"

[[example]]
name = "live_ranges"
path = "measurements/live_ranges.rs"

# What live_ranges only counted, applied and priced. Two arms behind one `main`, picked by
# argument - the fixed point over a group, and the shipped call over a menu.
[[example]]
name = "dead_quantify"
path = "measurements/dead_quantify.rs"

# Driven by tools/measure-matrix.sh, one row per process, for hours. Runnable by hand for
# a single row: CONVERSATION=368 PROFILE=deepest-1 cargo run --release --example
# performance_matrix
[[example]]
name = "performance_matrix"
path = "measurements/performance_matrix.rs"

[[example]]
name = "repeat_question"
path = "measurements/repeat_question.rs"

[[example]]
name = "per_start_setup"
path = "measurements/per_start_setup.rs"

[[example]]
name = "group_census"
path = "measurements/group_census.rs"

[[example]]
name = "search_residue"
path = "measurements/search_residue.rs"

[[example]]
name = "shared_symbolic"
path = "measurements/shared_symbolic.rs"

# A GENERATOR rather than a measurement: two of its three passes write the committed files
# under analysis/.
[[example]]
name = "static_analysis"
path = "measurements/static_analysis.rs"

[[example]]
name = "unread_slots"
path = "measurements/unread_slots.rs"

[[example]]
name = "settles_within"
path = "measurements/settles_within.rs"

[[example]]
name = "prune_on_menus"
path = "measurements/prune_on_menus.rs"

# Structure alone - no diagrams, no guards, no world - so `all` sweeps the whole game in
# seconds where a search-bearing measurement takes days.
[[example]]
name = "dominance_share"
path = "measurements/dominance_share.rs"

# Structural too, and the gate on de-a88z: whether two options of one menu ask the same
# questions at all.
[[example]]
name = "candidate_recurrence"
path = "measurements/candidate_recurrence.rs"

# The same walk with the searches actually run: how many of the recurring asks end in a
# verdict a memo could hold, and what holding one costs. The gate on de-znov.3.
[[example]]
