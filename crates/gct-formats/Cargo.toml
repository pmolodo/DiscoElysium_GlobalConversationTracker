[package]
name = "gct_formats"
version = "0.1.0"
edition = "2024"

# WHAT THE GAME ITSELF READS, and nothing else, which is what makes this a crate rather than
# a module of the engine. The mod has to read its own state file and the open save's tables
# from inside a running game, and it links a library to do it - so what that library drags in
# is the whole question. Built from the engine crate it would be the thirty megabytes
# `Cargo.toml` at the root records the removal of.
#
# THE DEPENDENCY LIST IS THE POINT, and it is three entries long. How this repository STORES
# a save - the manifest, the diffs, the packer - is `gct_save_files`, and it is apart from
# here because it needs a differ, an archive and a clock, none of which the game links. A
# dependency that appears below is a question somebody has to answer. See de-2p8j.1.
#
# NOTHING HERE KNOWS ABOUT THE SEARCH either. That was already true as a module - src/formats
# used nothing else in the crate - and the split is what stops it quietly becoming untrue.
[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
