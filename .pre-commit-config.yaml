# enable these with:
# uv tool install prek
# prek install

# Hooks run in the order declared below: ty, then ruff, then black.
repos:
    # ty - Python type checker. --fix applies ty's safe fixes, which makes this a
    # file-modifying hook, so it runs first: ruff then sorts any imports ty adds,
    # and black lays out whatever ty wrote.
    # (--fix is passed through the hook's `uv check` wrapper, which exposes it.
    # ty's own flags - --exit-zero, --warn, --add-ignore - are NOT reachable via
    # args; configure those in pyproject.toml under [tool.ty] instead.)
    - repo: https://github.com/astral-sh/ty-pre-commit
      rev: v0.0.69
      hooks:
          - id: ty
            args: [--fix]

    # Ruff - Python linter + import organizer (formatting is black's job).
    # --fix applies every safe fix ruff has (unsafe fixes still need an explicit
    # --unsafe-fixes).
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.2
      hooks:
          - id: ruff-check
            args: [--config=pyproject.toml, --fix]

    # Black - Python code formatter. Runs last so that black, not ty's or ruff's
    # fixes, gets the last word on layout.
    - repo: https://github.com/psf/black
      rev: 26.5.1
      hooks:
          - id: black
            language_version: python3
            args: [--config=pyproject.toml]

    # General hooks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
            files: >-
                \.(?:bash|bat|bats|c|cc|cmd|cpp|cs|csx|cxx|h|h\+\+|hh|hpp|hxx|inl|ipp|json|jsonc|ps1|psd1|psm1|py|pyi|pyw|rs|sh|toml|tpp|yaml|yml)$
          - id: end-of-file-fixer
            files: >-
                \.(?:bash|bat|bats|c|cc|cmd|cpp|cs|csx|cxx|h|h\+\+|hh|hpp|hxx|inl|ipp|json|jsonc|ps1|psd1|psm1|py|pyi|pyw|rs|sh|toml|tpp|yaml|yml)$
          - id: mixed-line-ending
            alias: enforce-lf-line-endings
            name: enforce LF line endings
            args: [--fix=lf]
            files: >-
                \.(?:bash|bats|c|cc|cpp|cs|csx|cxx|h|h\+\+|hh|hpp|hxx|inl|ipp|json|jsonc|py|pyi|pyw|rs|sh|toml|tpp|yaml|yml)$
          - id: mixed-line-ending
            alias: enforce-crlf-line-endings
            name: enforce CRLF line endings
            args: [--fix=crlf]
            files: >-
                \.(?:bat|cmd|ps1|psd1|psm1)$
          - id: check-yaml
          - id: check-toml

    # rustfmt, against the rustfmt.toml at the repository root. Python has had a formatter
    # here since this file existed and Rust has not, so `cargo fmt --check` disagreed with
    # most of the codebase and nothing said so - while the .vscode block that turns
    # formatOnSave on already named rust, so an editor was reformatting whatever a person
    # happened to touch. A one-line change then arrived as a fifty-line diff.
    #
    # LOCAL RATHER THAN A PUBLISHED HOOK REPO, because the formatter that must run is the
    # one the toolchain already has: a pinned rustfmt from elsewhere would lay the code out
    # differently from `cargo fmt` run by hand, and then the two would fight.
    #
    # PER FILE, because prek passes only the staged .rs files - so a commit touching one file
    # does not reformat the tree.
    #
    # NO --edition FLAG. rustfmt would default to 2015 if nothing said otherwise, but
    # rustfmt.toml does say otherwise, and rustfmt finds it by searching upwards from the file
    # it is given: `rustfmt --print-config current src/lib.rs` reports edition 2024. Naming it
    # here as well would be a second place to keep in step with Cargo.toml, and the one nobody
    # would think to look at.
    - repo: local
      hooks:
          - id: rustfmt
            name: rustfmt
            entry: rustfmt
            language: system
            types: [rust]
            pass_filenames: true
