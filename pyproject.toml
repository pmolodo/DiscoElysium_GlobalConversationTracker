[tool.black]
exclude = '''
^/(
  (
    # root directories to exclude
    \.DS_Store
    | \.conan
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.vs
    | \.vscode
    | _venv
  )/
  # any rooted files to ignore would go here
)
# unrooted paths here
| __pycache__/
'''
# In different versions of black, there were 3 different ways to turn on
# the same thing - splitting up of long string literals
# experimental-string-processing = true  # raises a warning in modern black versions
preview = true
enable-unstable-feature = ['string_processing']

line-length = 88

# Black formats; ruff lints and sorts imports. Keep the two line-lengths in sync.
[tool.ruff]
line-length = 88
# ruff's default excludes already cover .git, .hg, .mypy_cache, .tox, .venv,
# .vscode, __pycache__, etc.
extend-exclude = [".DS_Store", ".conan", ".vs", "CVS", "_venv"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    # "PL", # pylint - disabling, too noisy
]
ignore = [
    # E203 = whitespace before ':' - black will format like `"mystr"[2 + 1 :]`, which this check doesn't like
    "E203",
    # E402 = module level import not at top of file
    "E402",
    # E501 = line too long - black handles line length, and can't split some long tokens
    "E501",
    # PLC0415 = import outside top-level
    "PLC0415",
    # PLW1510 = `subprocess.run` without an explicit `check` argument
    "PLW1510",
]

[tool.ruff.lint.isort]
lines-between-types = 1
combine-as-imports = true

# ty is advisory: report type problems, but never fail a build or block a commit.
# Both halves are required - demoting the diagnostics is not enough on its own,
# because ty exits 1 on warnings too unless error-on-warning is turned off.
[tool.ty.rules]
all = "warn"

[tool.ty.terminal]
error-on-warning = false
